<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Voice of Customer Copilot — AI-driven product discovery tool transforming raw customer feedback into evidence-backed product opportunities.">
  <title>Voice of Customer Copilot | Evidence-Backed Product Discovery</title>
  
  <!-- Modern Typography (Plus Jakarta Sans & JetBrains Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">

  <!-- CSS Stylesheets (Relative paths for static & local deployment) -->
  <link rel="stylesheet" href="./css/index.css">
  <link rel="stylesheet" href="./css/components.css">
  <link rel="stylesheet" href="./css/views.css">
</head>
<body>
  <div id="app" class="app-layout">
    <!-- Navbar Header -->
    <header id="app-header" class="app-header"></header>

    <!-- Main Content Container with Smooth Routing -->
    <main id="main-content" class="main-content" role="main">
      <div id="view-container" class="view-container"></div>
    </main>

    <!-- Modal Container -->
    <div id="modal-root" class="modal-root" aria-hidden="true"></div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="toast-container" role="region" aria-live="polite"></div>
  </div>

  <!-- Scripts -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
